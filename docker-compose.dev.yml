# ═══════════════════════════════════════════════════════════════
# Local development override — exposes ports directly, no Nginx/SSL
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ═══════════════════════════════════════════════════════════════
services:
  backend:
    ports:
      - "8000:8000"
    networks:
      - internal

  frontend:
    ports:
      - "3000:3000"
    build:
      context: ./frontend_next-1
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
    networks:
      - internal

  # Disable nginx and certbot for local dev
  nginx:
    profiles:
      - production
  certbot:
    profiles:
      - production

networks:
  internal:
    driver: bridge
