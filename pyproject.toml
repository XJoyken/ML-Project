[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-project"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "catboost",
    "lightgbm",
    "xgboost",
    "mlflow",
    "matplotlib",
    "seaborn",
    "pydantic",
    "fastapi",
    "uvicorn",
    "google-genai",
]

[tool.setuptools.packages.find]
where = ["src"]
