services:
  backend:
    build: .
    container_name: ml-backend
    volumes:
      - ./datasets:/app/datasets:ro
      - ./models:/app/models:ro
      - ./mlruns:/app/mlruns:ro
      - ./mlflow.db:/app/mlflow.db:ro
    env_file:
      - .env
    networks:
      - internal
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend_next-1
      args:
        NEXT_PUBLIC_BACKEND_URL: https://api.xjoyken.dev
    container_name: ml-frontend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: ml-mlflow
    volumes:
      - ./mlflow.db:/data/mlflow.db
      - ./mlruns:/data/mlruns
    networks:
      - internal
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: ml-tunnel
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - internal
    depends_on:
      - backend
      - frontend
      - mlflow
    restart: unless-stopped

networks:
  internal:
    driver: bridge