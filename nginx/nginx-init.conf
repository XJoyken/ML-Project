# ═══════════════════════════════════════════════════════════════
# Initial Nginx config — HTTP only, for Let's Encrypt bootstrap
# ═══════════════════════════════════════════════════════════════
# Used ONLY during the first certbot run (before SSL certs exist).
# After certs are obtained, switch to the full nginx.conf.

server {
    listen 80;
    server_name YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'AlmatyNest — waiting for SSL certificate...';
        add_header Content-Type text/plain;
    }
}
